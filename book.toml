[book]
authors = ["CloudPlayPlus Team"]
language = "zh-CN"
src = "src"
title = "CloudPlayPlus 用户手册"
description = "CloudPlayPlus 跨平台云游戏客户端的完整用户手册和开发者指南"

[output.html]
git-repository-url = "https://github.com/zhuhaichao518/cloudplayplus_book"
git-repository-icon = "fa-github"
site-url = "/"
site-title = "CloudPlayPlus 用户手册"
site-description = "CloudPlayPlus 跨平台云游戏客户端的完整用户手册和开发者指南"
additional-css = ["custom.css"]
additional-js = ["custom.js"]
default-theme = "light"
preferred-dark-theme = "dark"
edit-url-template = "https://github.com/your-org/cloudplayplus_book/edit/main/src/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
title = "搜索"
description = "搜索 CloudPlayPlus 文档"
limit-results = 30
use-keyboard-shortcuts = true

[output.html.theme]
primary = "#2196F3"
accent = "#FF4081"

[output.html.markdown]
code-font-family = "Consolas, 'Monaco', 'Andale Mono', monospace"
code-font-size = "14px"
line-numbers = true
line-number-start = 1
copy-button = true
copy-button-text = "复制"
copy-button-success-text = "已复制！"
